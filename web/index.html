<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXTDC IPAM (POC)</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body class="theme-aurora signed-out">
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark">IP</span>
        <span><span class="brand-name">NEXTDC IPAM</span><br><span class="brand-sub">Proof of concept</span></span>
      </a>
      <nav id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <a class="who" href="#/account" title="My account">
          <span class="avatar" id="avatar"></span>
          <span class="who-text"><span class="who-name" id="who-name"></span><br><span class="who-role" id="who-role"></span></span>
        </a>
        <div class="foot-actions">
          <button type="button" class="btn btn-small" id="theme-toggle" title="Switch light / dark"></button>
          <button type="button" class="btn btn-small btn-ghost" id="signout">Sign out</button>
        </div>
      </div>
    </aside>
    <div class="content">
      <main id="app"><p class="muted">Loading…</p></main>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
