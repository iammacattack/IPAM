# NEXTDC IPAM POC. Localhost only: nothing is published beyond 127.0.0.1.
#   docker compose up --build -d                                    # run
#   docker compose --profile test run --rm --build tests             # engine + end-to-end tests
# Secrets come from .env (create it with scripts/Initialize-IpamEnv.ps1).
name: nextdc-ipam

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ipam
      POSTGRES_USER: ipam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Named volume, not a bind mount: keeps the live database out of any cloud-synced folder.
      - ipam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipam -d ipam"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://ipam:${POSTGRES_PASSWORD}@db:5432/ipam
      IPAM_BOOTSTRAP_API_KEY: ${IPAM_BOOTSTRAP_API_KEY:?Set IPAM_BOOTSTRAP_API_KEY in .env}
      IPAM_EXPIRY_SWEEP_SECONDS: ${IPAM_EXPIRY_SWEEP_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${IPAM_PORT:-8820}:8000"
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      IPAM_BASE_URL: http://api:8000/api/v1
      IPAM_API_KEY: ${IPAM_BOOTSTRAP_API_KEY}
      DATABASE_URL: postgresql://ipam:${POSTGRES_PASSWORD}@db:5432/ipam
      # The end-to-end suite clears site allocations before it runs so the reference workflows are repeatable.
      IPAM_TEST_RESET: "1"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ipam_pgdata:
